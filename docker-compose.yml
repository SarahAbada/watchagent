services:
  watchagent:
    build: .
    container_name: watchagent
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/data/weather.db
      LOG_DIR: /app/logs
      POLL_INTERVAL_SECONDS: "300"
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
