services:
  watchagent:
    build: .
    container_name: watchagent
    ports:
      - "8000:8000"
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "8000"
      DATABASE_PATH: /app/data/weather.db
      LOG_DIR: /app/logs
      POLL_INTERVAL_SECONDS: "300"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./app:/app/app        
    restart: unless-stopped